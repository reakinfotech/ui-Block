<!DOCTYPE html>
<html>

<head>
  <title>UI Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f8fafc;
      /* Soft Slate */
      --card-bg: rgba(255, 255, 255, 0.8);
      --text: #1e293b;
      /* Deep Slate */
      --text-muted: #64748b;
      --border: rgba(226, 232, 240, 0.8);
    }

    /* Forced Dark Theme Class */
    .dark-theme {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not(.light-theme) {
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.9);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
      }
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(to right, #818cf8, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cbd5e1;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: var(--primary);
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }

    .status {
      padding: 16px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .status.active {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.2);
    }

    .status.inactive {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.2);
    }

    .button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .loading {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <img src="icons/48.png" alt="Icon">
        <h1>UI Blocker</h1>
      </div>
      <label class="switch">
        <input type="checkbox" id="powerToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="status" id="status">
      <div class="loading"></div>
      Syncing...
    </div>
    <button class="button" id="optionsBtn">Advanced Settings</button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
