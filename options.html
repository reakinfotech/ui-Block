<!DOCTYPE html>
<html>
<head>
  <title>Content Blocker Settings</title>
  <style>
    body {
      width: 500px;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 300px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Content Blocker Filters</h2>
  <textarea id="filterInput" placeholder="Enter filter rules here...">
    ||localhost:5173*$image
    ||localhost:5173/affiliates/*$image
    ||localhost:5173/categories/*$image
    
    localhost##a.bg-zinc-800.z-10.relative.text-2xl.font-bold.justify-center.items-center.flex.group.h-24.overflow-hidden.rounded.aspect-video > .drop-shadow
    localhost##.py-2.px-4.relative.truncate.drop-shadow
    localhost##.aspect-video > .drop-shadow
    
    
    ||*faptap.net/affiliates/*$image
    ||*faptap.net/categories/*$image
    ||*faptap.net/*$image
    ||*faptap.net/*$media
    
    faptap.net##a.bg-zinc-800.z-10.relative.text-2xl.font-bold.justify-center.items-center.flex.group.h-24.overflow-hidden.rounded.aspect-video > .drop-shadow
    faptap.net##.py-2.px-4.relative.truncate.drop-shadow
    faptap.net##.aspect-video > .drop-shadow
    
    staging-chuck.faptap.net##a.bg-zinc-800.z-10.relative.text-2xl.font-bold.justify-center.items-center.flex.group.h-24.overflow-hidden.rounded.aspect-video > .drop-shadow
    staging-chuck.faptap.net##.py-2.px-4.relative.truncate.drop-shadow
    staging-chuck.faptap.net##.aspect-video > .drop-shadow
    
    staging-chuck.faptap.net##video:style(opacity: 0.1 )
    faptap.net##video:style(opacity: 0.1)
    
    iframe.mediadelivery.net##video:style(opacity: 0.1)
    
    *b-cdn.net/*$image
    strp.chat/*$image
    stripchat.com/*$image
    static-cdn.strpst.com/*$image
    img.doppiocdn.com/*$image
    strp.*##svg:style(opacity: 0.1)
    stripchat.*##svg:style(opacity: 0.1)
    stripchat.*##video:style(opacity: 0.1)
    
  </textarea>
  <button id="saveBtn">Save Filters</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
